AWSTemplateFormatVersion: '2010-09-09'
Description: 'LocalNet Production Direct S3 Media Storage (No CloudFront Required)'

Parameters:
  EnvironmentName:
    Type: String
    Default: 'prod'
    Description: 'Deployment environment name (e.g. dev, prod)'

Resources:
  # 1. Direct S3 Bucket for Media Storage with CORS enabled for web uploads & streaming
  LocalNetMediaBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'localnet-media-${AWS::AccountId}-${AWS::Region}'
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - GET
              - PUT
              - POST
              - HEAD
            AllowedOrigins:
              - 'http://localhost:3000'
              - 'https://*.vercel.app'
              - '*'
            MaxAge: 3600

  # 2. Bucket Policy: Allow Public Read for Published Media (Photos & Videos)
  LocalNetMediaBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref LocalNetMediaBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: PublicReadGetObject
            Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub 'arn:aws:s3:::${LocalNetMediaBucket}/*'

  # 3. Dedicated IAM User for LocalNet Backend App
  LocalNetAppUser:
    Type: AWS::IAM::User
    Properties:
      UserName: !Sub 'localnet-app-backend-${EnvironmentName}'

  # 4. Least-Privilege IAM Policy for S3 Uploads & Asset Management
  LocalNetAppPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: LocalNetS3StoragePolicy
      Users:
        - !Ref LocalNetAppUser
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:DeleteObject
              - s3:HeadObject
              - s3:ListBucket
            Resource:
              - !Sub 'arn:aws:s3:::${LocalNetMediaBucket}'
              - !Sub 'arn:aws:s3:::${LocalNetMediaBucket}/*'

  # 5. Generate Access Key for the App User
  LocalNetAppAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      UserName: !Ref LocalNetAppUser

Outputs:
  S3BucketName:
    Description: 'AWS S3 Bucket Name for LocalNet'
    Value: !Ref LocalNetMediaBucket

  AWSRegion:
    Description: 'AWS Region'
    Value: !Ref 'AWS::Region'

  S3MediaBaseUrl:
    Description: 'Direct S3 Media Base URL'
    Value: !Sub 'https://${LocalNetMediaBucket}.s3.${AWS::Region}.amazonaws.com'

  AccessKeyId:
    Description: 'AWS_ACCESS_KEY_ID to put in .env'
    Value: !Ref LocalNetAppAccessKey

  SecretAccessKey:
    Description: 'AWS_SECRET_ACCESS_KEY to put in .env'
    Value: !GetAtt LocalNetAppAccessKey.SecretAccessKey
